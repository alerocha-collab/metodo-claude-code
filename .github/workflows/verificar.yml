name: verificar

# Fecha, na propria metodologia, a lacuna "sem CI" que a auditoria identificou:
# um hook pre-commit local e contornavel com --no-verify. Isto nao e.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    name: suites (fail-closed)
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` porque o detector de bump compara HEAD com a base. Com o
      # checkout raso padrao (profundidade 1) a base nao existe, e ele avisaria em
      # vez de verificar — falha aberta silenciosa, que e o que ele existe para
      # impedir.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar todas as suites
        run: python3 tests/testar_tudo.py

      # O runner e fail-closed: suite ausente conta como falha. Este passo prova
      # que a propriedade vale de verdade, em vez de confiar no comentario do
      # codigo — move as suites para fora e exige que o runner reprove.
      - name: Provar que o runner reprova quando nao ha suite
        run: |
          mkdir -p /tmp/vazio/tests
          cp tests/testar_tudo.py /tmp/vazio/tests/
          if python3 /tmp/vazio/tests/testar_tudo.py; then
            echo "FALHA: o runner aprovou um repositorio sem suite nenhuma."
            exit 1
          fi
          echo "ok: runner reprovou, como deve."

      # O plugin depende de python3. Sem tratamento, a AUSENCIA dele faz o shell
      # sair com 127, que a doc classifica como nao bloqueante — o portao
      # falharia aberto na maquina mal configurada. Este passo prova, no comando
      # literal do hooks.json, que a rede converte isso em bloqueio.
      - name: Provar que o portao bloqueia quando python3 falta
        run: |
          CMD=$(python3 -c "import json;print(json.load(open('plugins/metodo/hooks/hooks.json'))['hooks']['Stop'][0]['hooks'][0]['command'])")
          echo "comando do hook: $CMD"
          # Roda o comando literal com um PATH sem python3.
          set +e
          env -i PATH=/usr/bin:/bin CLAUDE_PLUGIN_ROOT="$PWD/plugins/metodo" \
            sh -c "$(echo "$CMD" | sed 's/python3 /python3-que-nao-existe /')"
          CODIGO=$?
          set -e
          echo "exit=$CODIGO"
          if [ "$CODIGO" -ne 2 ]; then
            echo "FALHA: esperava exit 2 (bloqueia); veio $CODIGO."
            echo "Sem exit 2 o portao libera o turno numa maquina sem python3."
            exit 1
          fi
          echo "ok: interpretador ausente bloqueia."

      # Estrutura do indice da doutrina: SEM rede. Drift depende da doc mudar, que
      # nao e falha de build — quem verifica drift e uma pessoa, deliberadamente.
      - name: Validar a integridade do indice de fontes
        run: python3 plugins/doutrina/scripts/verificar_fontes.py

      # Todo push para `main` e um release: o marketplace aponta para ./plugins/<nome>
      # e o cache de quem instalou e chaveado por versao. Mudar conteudo sem mudar
      # `version` publica um plugin diferente sob o mesmo numero, e quem ja instalou
      # fica com a copia antiga sem nada avisar. Este passo torna isso um erro.
      - name: Exigir bump de version quando um plugin muda
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Push inicial de branch, ou historico reescrito: o git usa 40 zeros.
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) BASE="HEAD~1" ;;
          esac
          echo "comparando com: $BASE"
          python3 scripts/verificar_bump.py "$BASE"

      # O passo acima so aprova. Sem esta prova, um detector quebrado — regex que
      # nunca casa, `plugin_de` devolvendo None sempre — passaria em silencio e o
      # portao inteiro seria decorativo. Aqui um commit descartavel altera conteudo
      # de plugin SEM subir version, e o detector tem que reprovar.
      - name: Provar que o detector de bump reprova quando falta o bump
        run: |
          git config user.email ci@exemplo && git config user.name ci
          echo "<!-- linha descartavel, so para este teste -->" >> plugins/doutrina/referencias/armadilhas.md
          git commit -qam "commit descartavel: muda plugin sem subir version"
          set +e
          python3 scripts/verificar_bump.py HEAD~1
          CODIGO=$?
          set -e
          git reset -q --hard HEAD~1
          if [ "$CODIGO" -eq 0 ]; then
            echo "FALHA: o detector aprovou um plugin alterado sem bump de version."
            exit 1
          fi
          echo "ok: falta de bump reprova (exit $CODIGO)."

      - name: Validar a fila de tickets, se existir
        run: |
          if [ -f tickets/fila.json ]; then
            python3 plugins/metodo/scripts/validar_fila.py tickets/fila.json
          else
            echo "sem tickets/fila.json neste repositorio; nada a validar."
          fi

  plugin:
    name: manifesto do plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Validar os plugins em modo estrito
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          claude plugin validate ./plugins/metodo --strict
          claude plugin validate ./plugins/doutrina --strict

      # Validar a raiz valida o MARKETPLACE, nao os plugins: schema, nomes
      # duplicados, travessia de caminho, e se a `version` de cada entrada bate com
      # o plugin.json de destino. `--strict` importa: divergencia de version e so
      # AVISO, e sem ele o manifesto errado passa.
      - name: Validar o marketplace em modo estrito
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          claude plugin validate . --strict

      # Prova que a validacao acima morde de verdade, em vez de confiar no
      # comentario: divergir a version tem que reprovar.
      - name: Provar que o validador do marketplace reprova version divergente
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cp .claude-plugin/marketplace.json /tmp/mkt.bak
          python3 -c "import json;d=json.load(open('.claude-plugin/marketplace.json'));d['plugins'][0]['version']='9.9.9';json.dump(d,open('.claude-plugin/marketplace.json','w'))"
          set +e
          claude plugin validate . --strict >/dev/null 2>&1
          CODIGO=$?
          set -e
          cp /tmp/mkt.bak .claude-plugin/marketplace.json
          if [ "$CODIGO" -eq 0 ]; then
            echo "FALHA: o validador aprovou um marketplace com version divergente."
            exit 1
          fi
          echo "ok: version divergente reprova (exit $CODIGO)."
